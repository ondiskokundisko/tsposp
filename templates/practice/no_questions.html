{% extends 'base.html' %}
{% block title %}Žádné otázky{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-20 text-center animate-fade">
    <div class="text-6xl mb-6">📭</div>
    <h1 class="text-2xl font-bold text-gray-800 mb-3">Žádné otázky k dispozici</h1>
    <p class="text-gray-500 mb-8">
        Pro dimenzi <strong>{{ dimension }}</strong> zatím nejsou dostupné žádné otázky.
        Zkuste to prosím později.
    </p>
    <a href="{% url 'practice:dashboard' %}" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-blue-700 transition">
        ← Zpět na dashboard
    </a>
</div>
{% endblock %}
